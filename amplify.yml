version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Next.js 16 requires Node >=20.9.0; pin so the build image can't drift below it.
        - nvm install 22 && nvm use 22
        - 'echo "NODE_VERSION (pinned): $(node -v)"'
        - npm ci --cache .npm --prefer-offline

    build:
      commands:
        # Amplify does not expose console environment variables to the SSR runtime.
        # Write the non-secret ones the server action needs into .env.production.
        # AWS credentials come from the app's compute role; never write keys here.
        - echo "# Generated at build $(date)" > .env.production
        - echo "AWS_REGION=${AWS_REGION}" >> .env.production
        - echo "LAMBDA_FUNCTION_ARN=${LAMBDA_FUNCTION_ARN}" >> .env.production
        - echo "ADMIN_USER_ID=${ADMIN_USER_ID}" >> .env.production
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
      - '../.env.production'
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'Cache-Control'
          value: 'public, max-age=0, must-revalidate'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
